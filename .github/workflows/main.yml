jobs:
  test:
    runs-on: ubuntu-latest

    env:
      API_URL: http://127.0.0.1:3000
      MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test
      JWT_SECRET: segredo-teste-pipeline
      ADMIN_EMAIL: admin@escola.com
      ADMIN_PASSWORD: admin123
      ALUNO_PASSWORD: aluno123
      ALUNO_EMAIL_DOMINIO: example.com

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar API
        run: |
          npm start > /tmp/api.log 2>&1 &
          for tentativa in {1..30}; do
            if curl --fail --silent "$API_URL/" > /dev/null; then
              echo "API pronta."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/api.log
          exit 1

      - name: Executar testes
        run: npm test